baseURL = 'https://theautonomouscreator.netlify.app/'
theme = 'ananke'
defaultContentLanguage = 'pl'

# Keep global params
[params]
  custom_css = ["custom.css"]
  favicon = "/Logo_wo_bg.png"

  [[params.social]]
    name = "instagram"
    url = "https://www.instagram.com/szym0n_24/"
  [[params.social]]
    name = "facebook"
    url = "https://www.facebook.com/szymon.derlecki.3/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# =========================================================
# LANGUAGES & MENUS
# =========================================================

[languages]

  # --- POLISH (Default) ---
  [languages.pl]
    languageName = "🇵🇱 Polski"
    languageCode = "pl"
    title = "The Autonomous Creator"
    weight = 1
    contentDir = "content/pl"

    [languages.pl.menu]
      [[languages.pl.menu.main]]
        name = "Strona Główna"
        url = "/"
        weight = 1
      [[languages.pl.menu.main]]
        name = "Studia w Danii"
        url = "/categories/studia-w-danii" 
        weight = 2
      [[languages.pl.menu.main]]
        name = "Technologie i Projekty"
        url = "/categories/technologie_projekty"
        weight = 3
      [[languages.pl.menu.main]]
        name = "On The Go"
        url = "/categories/on-the-go"
        weight = 4
      [[languages.pl.menu.main]]
        name = "Kontakt"
        url = "/kontakt/"
        weight = 5
      [[languages.pl.menu.main]]
        name = "O mnie"
        url = "/categories/bio"
        weight = 6

  # --- BRITISH ENGLISH ---
  [languages.en]
    languageName = "🇬🇧 English"
    languageCode = "en-gb"
    title = "The Autonomous Creator"
    weight = 2
    contentDir = "content/en"

    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/"
        weight = 1
      [[languages.en.menu.main]]
        name = "Studies in Denmark"
        # Since we added slug: "studies-in-denmark" in the .md file, we use that here!
        url = "/categories/studies-in-denmark" 
        weight = 2
      [[languages.en.menu.main]]
        name = "Tech & Projects"
        url = "/categories/technologies-and-projects"
        weight = 3
      [[languages.en.menu.main]]
        name = "On The Go"
        url = "/categories/on-the-go"
        weight = 4
      [[languages.en.menu.main]]
        name = "Contact"
        url = "/kontakt/"
        weight = 5
      [[languages.en.menu.main]]
        name = "About Me"
        url = "/categories/about-me"
        weight = 6