baseURL = 'https://theautonomouscreator.netlify.app/'
title = 'The Autonomous Creator'
theme = 'ananke'

# Ustawiamy, że domyślnym językiem jest Polski
defaultContentLanguage = 'pl'

[params]
  custom_css = ["custom.css"]
  favicon = "/Logo_wo_bg.png"

# Social media są wspólne (chyba że chcesz oddzielne, to daj znać)
[[params.social]]
  name = "instagram"
  url = "https://www.instagram.com/szym0n_24/"

[[params.social]]
  name = "facebook"
  url = "https://www.facebook.com/szymon.derlecki.3/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# --- KONFIGURACJA JĘZYKÓW ---

[languages]
  # === JĘZYK POLSKI ===
  [languages.pl]
    languageName = 'Polski'
    weight = 1
    contentDir = 'content' 
    
    # Menu dla wersji Polskiej (Twoje stare linki)
    [languages.pl.menu]
      [[languages.pl.menu.main]]
        name = "Strona Główna"
        url = "/"
        weight = 1
      [[languages.pl.menu.main]]
        name = "O mnie"
        url = "/categories/bio"
        weight = 6
      [[languages.pl.menu.main]]
        name = "Studia w Danii"
        url = "/categories/studia-w-danii"
        weight = 2
      [[languages.pl.menu.main]]
        name = "Technologie i Projekty"
        url = "/categories/technologie-i-projekty"
        weight = 3
      [[languages.pl.menu.main]]
        name = "On The Go"
        url = "/categories/on-the-go"
        weight = 4
      [[languages.pl.menu.main]]
        name = "Kontakt"
        url = "/kontakt/"
        weight = 5

  # === JĘZYK ANGIELSKI ===
  [languages.en]
    languageName = 'English'
    weight = 2
    contentDir = 'content'
    
    # Menu dla wersji Angielskiej (Przetłumaczone + poprawione linki kategorii)
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/"
        weight = 1
      [[languages.en.menu.main]]
        name = "About me"
        url = "/categories/bio" 
        weight = 6
      [[languages.en.menu.main]]
        name = "Studies in Denmark"
        # WAŻNE: To musi pasować do kategorii wpisanej w angielskim poście (Studies in Denmark -> studies-in-denmark)
        url = "/categories/studies-in-denmark" 
        weight = 2
      [[languages.en.menu.main]]
        name = "Tech & Projects"
        # Pamiętaj, żeby w angielskich postach używać kategorii "Tech & Projects"
        url = "/categories/tech-projects" 
        weight = 3
      [[languages.en.menu.main]]
        name = "On The Go"
        url = "/categories/on-the-go"
        weight = 4
      [[languages.en.menu.main]]
        name = "Contact"
        url = "/kontakt/" 
        weight = 5