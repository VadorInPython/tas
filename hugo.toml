baseURL = "https://theautonomouscreator.netlify.app/"
languageCode = "en-us"
title = "The Autonomous Creator"
theme = "ananke"

# Ustawienia wielojęzyczne
defaultContentLanguage = "pl"
defaultContentLanguageInSubdir = true

[languages]

[languages.pl]
  languageName = "Polski"
  weight = 1
  title = "The Autonomous Creator"
  menu = "main"

[languages.en]
  languageName = "English"
  weight = 2
  title = "The Autonomous Creator"
  menu = "main"

[params]
custom_css = ["custom.css"]
favicon = "/Logo_wo_bg.png"

# Social media icons
[[params.social]]
  name = "instagram"
  url = "https://www.instagram.com/szym0n_24/"

[[params.social]]
  name = "facebook"
  url = "https://www.facebook.com/szymon.derlecki.3/"

# MENU osobno dla języków
[menu.pl]
  [[menu.pl.main]]
    name = "Strona Główna"
    url = "/pl/"
    weight = 1

  [[menu.pl.main]]
    name = "O mnie"
    url = "/pl/categories/bio"
    weight = 6

  [[menu.pl.main]]
    name = "Studia w Danii"
    url = "/pl/categories/studia-w-danii"
    weight = 2

  [[menu.pl.main]]
    name = "Technologie i Projekty"
    url = "/pl/categories/technologie_projekty"
    weight = 3

  [[menu.pl.main]]
    name = "On The Go"
    url = "/pl/categories/on-the-go"
    weight = 4

  [[menu.pl.main]]
    name = "Kontakt"
    url = "/pl/kontakt/"
    weight = 5

[menu.en]
  [[menu.en.main]]
    name = "Home"
    url = "/en/"
    weight = 1

  [[menu.en.main]]
    name = "About Me"
    url = "/en/categories/bio"
    weight = 6

  [[menu.en.main]]
    name = "Studies in Denmark"
    url = "/en/categories/studies-in-denmark"
    weight = 2

  [[menu.en.main]]
    name = "Tech & Projects"
    url = "/en/categories/tech-projects"
    weight = 3

  [[menu.en.main]]
    name = "On The Go"
    url = "/en/categories/on-the-go"
    weight = 4

  [[menu.en.main]]
    name = "Contact"
    url = "/en/contact/"
    weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
