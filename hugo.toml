baseURL = 'https://theautonomouscreator.netlify.app/'
title = 'The Autonomous Creator'
theme = 'ananke'

# Ustawiamy, że domyślnym językiem jest Polski
defaultContentLanguage = 'pl'

[params]
  custom_css = ["custom.css"]
  favicon = "/Logo_wo_bg.png"
  # To zapewnia, że na głównej są tylko wpisy z folderu 'posts'
  mainSections = ["posts"] 

# Social media
[[params.social]]
  name = "instagram"
  url = "https://www.instagram.com/szym0n_24/"

[[params.social]]
  name = "facebook"
  url = "https://www.facebook.com/szymon.derlecki.3/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# --- KONFIGURACJA JĘZYKÓW ---

[languages]
  # === JĘZYK POLSKI ===
  [languages.pl]
    languageName = 'Polski'
    weight = 1
    contentDir = 'content' 
    
    # Menu dla wersji Polskiej
    [languages.pl.menu]
      [[languages.pl.menu.main]]
        name = "Strona Główna"
        url = "/"
        weight = 1
      [[languages.pl.menu.main]]
        name = "O mnie"
        url = "/categories/bio"
        weight = 2
      [[languages.pl.menu.main]]
        name = "Studia w Danii"
        url = "/categories/studia-w-danii"
        weight = 3
      [[languages.pl.menu.main]]
        name = "Technologie i Projekty"
        url = "/categories/technologie-i-projekty"
        weight = 4
      [[languages.pl.menu.main]]
        name = "On The Go"
        url = "/categories/on-the-go"
        weight = 5
      [[languages.pl.menu.main]]
        name = "Kontakt"
        url = "/kontakt/"
        weight = 6

  # === JĘZYK ANGIELSKI ===
  [languages.en]
    languageName = 'English'
    weight = 2
    contentDir = 'content'
    
    # Menu dla wersji Angielskiej
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/"
        weight = 1
      [[languages.en.menu.main]]
        name = "About me"
        url = "/categories/bio" 
        weight = 2
      [[languages.en.menu.main]]
        name = "Studies in Denmark"
        url = "/categories/studies-in-denmark" 
        weight = 3
      [[languages.en.menu.main]]
        name = "Tech & Projects"
        url = "/categories/tech-projects" 
        weight = 4
      [[languages.en.menu.main]]
        name = "On The Go"
        url = "/categories/on-the-go"
        weight = 5
      [[languages.en.menu.main]]
        name = "Contact"
        url = "/kontakt/" 
        weight = 6