baseURL = "https://theautonomouscreator.netlify.app/"
languageCode = "en-us"
title = "The Autonomous Creator"
theme = "ananke"

defaultContentLanguage = "pl"
defaultContentLanguageInSubdir = true

[languages]
[languages.pl]
  languageName = "Polski"
  weight = 1
  title = "The Autonomous Creator"

[languages.en]
  languageName = "English"
  weight = 2
  title = "The Autonomous Creator"

[params]
custom_css = ["custom.css"]
favicon = "/Logo_wo_bg.png"

# Social media
[[params.social]]
name = "instagram"
url = "https://www.instagram.com/szym0n_24/"

[[params.social]]
name = "facebook"
url = "https://www.facebook.com/szymon.derlecki.3/"

# MENU dla Hugo (top-level)
[[menu.main]]
