baseURL = 'https://theautonomouscreator.netlify.app/'
languageCode = 'en-us'
title = 'The Autonomous Creator'
theme = 'ananke'

[params]
custom_css = ["custom.css"]
favicon = "/Logo_wo_bg.png" 

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false  # to może być problemem!

[languages]
  [languages.pl]
    languageName = "Polski"
    weight = 2
  [languages.en]
    languageName = "English"
    weight = 1

# Social media icons
[[params.social]]
  name = "instagram"
  url = "https://www.instagram.com/szym0n_24/"

[[params.social]]
  name = "facebook"
  url = "https://www.facebook.com/szymon.derlecki.3/"


[menu]
  [[menu.main]]
    name = "Strona Główna"
    url = "/"
    weight = 1
   
  [[menu.main]]
    name = "O mnie"
    url = "/categories/bio"
    weight = 6
   
  [[menu.main]]
    name = "Studia w Danii"
    url = "/categories/studia-w-danii"
    weight = 2
   
  [[menu.main]]
    name = "Technologie i Projekty"
    url = "/categories/technologie_projekty"
    weight = 3
   
  [[menu.main]]
    name = "On The Go"
    url = "/categories/on-the-go"
    weight = 4
     
  [[menu.main]]
    name = "Kontakt"
    url = "/kontakt/"
    weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]