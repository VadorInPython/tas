baseURL = "https://theautonomouscreator.netlify.app/"
title = "The Autonomous Creator"
theme = "ananke"
defaultContentLanguage = "pl"
defaultContentLanguageInSubdir = true

[params]
  custom_css = ["custom.css"]
  favicon = "/Logo_wo_bg.png"

  # Social media icons
  [[params.social]]
    name = "instagram"
    url = "https://www.instagram.com/szym0n_24/"

  [[params.social]]
    name = "facebook"
    url = "https://www.facebook.com/szymon.derlecki.3/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[languages]
  [languages.pl]
    languageCode = "pl-pl"
    languageName = "Polski"
    weight = 1
    title = "The Autonomous Creator"

    [languages.pl.menu]
      [[languages.pl.menu.main]]
        name = "Strona Główna"
        url = "/pl/"
        weight = 1

      [[languages.pl.menu.main]]
        name = "Studia w Danii"
        url = "/pl/categories/studia-w-danii/"
        weight = 2

      [[languages.pl.menu.main]]
        name = "Technologie i Projekty"
        url = "/pl/categories/technologie_projekty/"
        weight = 3

      [[languages.pl.menu.main]]
        name = "On The Go"
        url = "/pl/categories/on-the-go/"
        weight = 4

      [[languages.pl.menu.main]]
        name = "Kontakt"
        url = "/pl/kontakt/"
        weight = 5

      [[languages.pl.menu.main]]
        name = "O mnie"
        url = "/pl/categories/bio/"
        weight = 6

  [languages.en]
    languageCode = "en-us"
    languageName = "English"
    weight = 2
    title = "The Autonomous Creator"

    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/en/"
        weight = 1

      [[languages.en.menu.main]]
        name = "Studies in Denmark"
        url = "/en/categories/studies-in-denmark/"
        weight = 2

      [[languages.en.menu.main]]
        name = "Tech & Projects"
        url = "/en/categories/technologies_and_projects/"
        weight = 3

      [[languages.en.menu.main]]
        name = "On The Go"
        url = "/en/categories/on-the-go/"
        weight = 4

      [[languages.en.menu.main]]
        name = "Contact"
        url = "/contact/"
        weight = 5

      [[languages.en.menu.main]]
        name = "About"
        url = "/en/categories/bio/"
        weight = 6