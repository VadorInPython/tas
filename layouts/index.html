{{ define "main" }}
  <!-- Posts listing with white cards -->
  <div class="pa3 pa4-ns w-100 mw8 center">
    {{ range first 10 .Site.RegularPages }}
      <div class="relative w-100 mb4 bg-white br3 shadow-4 pa3">
        {{ if .Params.featured_image }}
          {{ $featured_image := .Params.featured_image }}
          <div class="relative w-100 mb3">
            <img src="{{ $featured_image | relURL }}" class="w-100 db br2" alt="{{ .Title }}" />
          </div>
        {{ end }}
        
        <article class="pb2">
          <div class="flex flex-column flex-row-ns">
            <div class="w-100">
              <h1 class="f3 fw1 athelas mt0 mb1">
                <a href="{{ .Permalink }}" class="color-inherit dim link">{{ .Title }}</a>
              </h1>
              <p class="f5 f4-l lh-copy measure mt0-ns">
                {{ .Summary }}
              </p>
              <a href="{{ .Permalink }}" class="ba b--moon-gray bg-light-gray br2 color-inherit dib f7 hover-bg-moon-gray link mt2 ph2 pv1">read more</a>
            </div>
          </div>
        </article>
      </div>
    {{ end }}
  </div>
{{ end }}
