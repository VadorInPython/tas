{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height nested-img">
    <section class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wider lh-copy mid-gray">
      {{/* Wyświetla opis kategorii/tagu, jeśli istnieje w pliku _index.md */}}
      {{ if .Content }}
        <div class="nested-copy-line-height nested-links nested-img mid-gray f4">
          {{ .Content }}
        </div>
      {{ end }}
    </section>

    <section class="flex-ns flex-wrap justify-around mt5">
      {{ range .Pages }}
        {{ partial "post-card.html" . }} {{/* <- WYWOŁUJEMY TEN SAM PARTIALA */}}
      {{ end }}
    </section>
  </article>
{{ end }}
