{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height nested-img">
    <section class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy mid-gray">
      <h1 class="fw1 f1">{{ .Title }}</h1>
      
      <!-- Use content from _index.md if it exists -->
      {{ if .Content }}
        <div class="nested-copy-line-height nested-links nested-img mid-gray">
          {{ .Content }}
        </div>
      {{ end }}
    </section>

    <!-- Posts listing -->
    <section class="flex-ns flex-wrap justify-around mt5">
      {{ range .Pages }}
        <div class="relative w-100 w-30-l mb4 bg-white">
          {{ if .Params.featured_image }}
            {{ $featured_image := .Params.featured_image }}
            <div class="relative w-100 mb3">
              <img src="{{ $featured_image | relURL }}" class="w-100 db" alt="{{ .Title }}" />
            </div>
          {{ end }}
          
          <div class="pa3">
            <h2 class="f5 f4-l fw7 black-90 mb2">
              <a href="{{ .Permalink }}" class="link black-90 dim">{{ .Title }}</a>
            </h2>
            
            <p class="f6 lh-copy black-60">
              {{ .Summary }}
            </p>
            
            <div class="f6 gray mt3">
              <time>{{ .Date.Format "January 2, 2006" }}</time>
            </div>
          </div>
        </div>
      {{ end }}
    </section>
  </article>
{{ end }}
