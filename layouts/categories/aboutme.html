{{ define "main" }}

<header style="background-color: darkred; padding: 10px 20px; color: white; font-weight: bold; font-size: 1.2rem;">
  The Autonomous Creator
  <nav style="float: right;">
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" style="color: white; margin-left: 15px; text-decoration: none;">{{ .Name }}</a>
    {{ end }}
  </nav>
  <div style="clear: both;"></div>
</header>

<main style="margin: 20px;">
  {{ range .Pages }}
    <article style="margin-bottom: 2em;">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ .Summary }}
    </article>
  {{ end }}
</main>

{{ end }}
