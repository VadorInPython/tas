{{ define "main" }}

<style>
  body {
    background-color: #fff; /* jasne tło całej strony */
    color: #111;
    font-family: sans-serif;
  }

  /* Pasek nagłówka u góry */
  header.site-header {
    background-color: #b22222; /* ciemnoczerwony */
    padding: 10px 0;
    color: white;
    text-align: center;
    font-weight: bold;
    font-size: 1.5rem;
  }

  /* Kontener na bio */
  .aboutme-content {
    max-width: 700px;
    margin: 2rem auto;
    padding: 1rem 2rem;
    background-color: #fff; /* białe tło pod bio */
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
</style>

<header class="site-header">
  The Autonomous Creator
</header>

<div class="aboutme-content">
  {{ .Content }}
</div>

{{ end }}
