{{ define "main" }}
  <style>
    body {
      background-color: #fff0f0;
      font-family: sans-serif;
      color: #111;
    }
    .aboutme-header {
      background-color: darkred;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      border-radius: 8px;
    }
    .aboutme-article {
      background: white;
      padding: 15px 20px;
      margin-bottom: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .aboutme-article h2 a {
      color: darkred;
      text-decoration: none;
    }
    .aboutme-article h2 a:hover {
      text-decoration: underline;
    }
    .aboutme-article p {
      margin-top: 0.5rem;
      color: #555;
    }
  </style>

  <div class="aboutme-header">About Me</div>

  <div class="mw7 center">
    {{ range .Pages }}
      <article class="aboutme-article">
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <p>{{ .Summary }}</p>
      </article>
    {{ end }}
  </div>
{{ end }}
