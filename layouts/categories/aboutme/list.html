{{ define "main" }}
  {{ if not (and (eq .Kind "taxonomy") (eq .Title "Aboutme")) }}
    {{ partial "header.html" . }}
  {{ end }}

  <main>
    {{ if .Title }}
      <h1 class="section-title">{{ .Title }}</h1>
    {{ end }}

    {{ .Content }}

    {{ if .Pages }}
      <section class="article-list">
        {{ range .Pages }}
          {{ .Render "summary" }}
        {{ end }}
      </section>
    {{ end }}
  </main>

  {{ partial "footer.html" . }}
{{ end }}
