{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height">
    <header class="ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy nested-links {{ $.Param "text_color" | compare.Default "mid-gray" }}">
      <h1 class="f2 f1-ns tc dark-gray mb5">{{ .Title }}</h1> {# Dodany tytuł strony kategorii #}
      {{- .Content -}} {# Tutaj Hugo wstawi całą treść z _index.md #}
    </header>

    <section class="flex-ns mt5 flex-wrap justify-around">
      {{ range .Paginator.Pages }}
        <div class="w-100 w-30-l mb4 relative bg-white">
          {{ .Render "summary" }}
        </div>
      {{ end }}
    </section>
    {{- template "_internal/pagination.html" . -}}
  </article>
{{ end }}
