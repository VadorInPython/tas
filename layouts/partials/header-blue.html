<header class="bg-gradient-blue">
  <nav class="pv3 ph3 ph4-ns" role="navigation">
    <div class="flex-l center items-center justify-between">
      <a href="/" class="f3 fw2 hover-white white-90 dib no-underline site-title">
        The Autonomous Creator
      </a>
      <div class="flex-l items-center">
        <ul class="pl0 mr3 flex-l">
          <!-- twoje menu jak było -->
          <li class="list f5 f4-ns fw4 dib pr3">
            <a class="hover-white white-90 no-underline" href="/" title="Home page">Home</a>
          </li>
          <!-- reszta menu... -->
          <li class="list f5 f4-ns fw4 dib pr3">
            <a class="hover-white white-90 no-underline" href="/contact/" title="Contact me">Contact me</a>
          </li>
        </ul>
        <!-- Social media z Hugo konfiguracji -->
        <div class="flex items-center">
          {{ range .Site.Params.social }}
            <a href="{{ .url }}" target="_blank" class="link white-90 hover-white dib f4 mr2" title="{{ .name | title }}">
              {{ if eq .name "facebook" }}FB{{ end }}
              {{ if eq .name "instagram" }}IG{{ end }}
            </a>
          {{ end }}
        </div>
      </div>
    </div>
  </nav>
</header>
