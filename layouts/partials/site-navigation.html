<!-- Font Awesome CSS for instant icon rendering -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />

<nav class="pv3 ph3 ph4-ns" role="navigation">
  <div class="flex-l center items-center justify-between">
    
    <!-- Logo / Site Title stays on the left -->
    <a href="{{ .Site.Home.RelPermalink }}" class="f3 fw2 hover-white white-90 dib no-underline">
      {{ with .Site.Params.site_logo }}
        <img src="{{ urls.RelURL . }}" class="w100 mw5-ns" alt="{{ $.Site.Title }}" />
      {{ else }}
        {{ .Site.Title }}
      {{ end }}
    </a>

    <!-- Right side: Menu + Social Icons -->
    <div class="flex items-center ml-auto">
      
      <!-- Menu Items -->
      <div class="flex-l items-center">
        {{ partials.Include "i18nlist.html" . }}
        {{ if .Site.Menus.main }}
          <ul class="{{ compare.Conditional (compare.Eq $.Site.Language.LanguageDirection "rtl") "pr0 ml3" "pl0 mr3" }}">
            {{ range .Site.Menus.main }}
            <li class="list f5 f4-ns fw4 dib {{ compare.Conditional (compare.Eq $.Site.Language.LanguageDirection "rtl") "pl3" "pr3" }}">
              <a class="hover-white white-90 no-underline" href="{{ .URL }}" title="{{ lang.Translate "pageTitle" . }}">
                {{ .Name }}
              </a>
            </li>
            {{ end }}
          </ul>
        {{ end }}
      </div>

      <!-- Social Icons -->
      <div class="flex items-center ml3 header-icons">
        <a href="https://x.com/GoHugoIO" class="white-90 hover-white mr2" target="_blank">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="https://www.facebook.com/szymon.derlecki.3/" class="white-90 hover-white mr2" target="_blank">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://www.instagram.com/theautonomouscreator/" class="white-90 hover-white mr2" target="_blank">
          <i class="fab fa-instagram"></i>
        </a>
      </div>

      <!-- Optional additional social partial -->
      {{ partials.IncludeCached "social/follow.html" . }}

    </div>
  </div>
</nav>

<!-- Optional CSS to reserve space and prevent layout shift -->
<style>
  .header-icons i {
    display: inline-block;
    width: 1.25em; /* ensures consistent width */
    text-align: center;
  }
</style>
