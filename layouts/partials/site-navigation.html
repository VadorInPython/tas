<!-- site-navigation.html -->
<!-- Font Awesome CSS for instant icon rendering -->
<script src="https://kit.fontawesome.com/c954e5bea9.js" crossorigin="anonymous"></script>

<nav class="pv3 ph3 ph4-ns" role="navigation">
  <div class="flex-l center items-center justify-between">
    <a
      href="{{ .Site.Home.RelPermalink }}"
      class="f3 fw2 hover-white white-90 dib no-underline site-title"
    >
      {{ with .Site.Params.site_logo }}
        <img
          src="{{ urls.RelURL . }}"
          class="w100 mw5-ns"
          alt="{{ $.Site.Title }}"
        />
      {{ else }}
        {{ .Site.Title }}
      {{ end }}
    </a>

    <button id="burger-menu-button" class="dn-l" aria-label="Open Menu">
      <i class="fas fa-bars"></i>
    </button>

    <div id="mobile-menu" class="flex-l items-center">
      <!-- === MOVED SOCIAL ICONS HERE === -->
      <div class="flex items-center justify-center header-icons">
        <a
          href="https://soundcloud.com/tac-107441469"
          class="white-90 hover-white mh3"
          target="_blank"
          aria-label="SoundCloud"
        >
          <i class="fab fa-soundcloud"></i>
        </a>
        <a
          href="https://www.youtube.com/@TheAutonomousCreator"
          class="white-90 hover-white mh3"
          target="_blank"
          aria-label="Youtube"
        >
          <i class="fab fa-youtube"></i>
        </a>
        <a
          href="https://www.facebook.com/szymon.derlecki.3/"
          class="white-90 hover-white mh3"
          target="_blank"
          aria-label="Facebook"
        >
          <i class="fab fa-facebook"></i>
        </a>
        <a
          href="https://www.instagram.com/theautonomouscreator/"
          class="white-90 hover-white mh3"
          target="_blank"
          aria-label="Instagram"
        >
          <i class="fab fa-instagram"></i>
        </a>
      </div>
      <!-- === END OF SOCIAL ICONS === -->

      <!-- === Przycisk otwierający wyszukiwarkę === -->
      <div class="mh3">
        <i
          id="search-icon"
          class="fas fa-search white-90 hover-white"
          style="cursor: pointer; font-size: 1.2rem"
        ></i>
      </div>

      <div class="flex-l items-center">
        {{ partials.Include "i18nlist.html" . }}
        {{ if .Site.Menus.main }}
          <ul
            class="{{ compare.Conditional (compare.Eq $.Site.Language.LanguageDirection "rtl") "pr0 ml3" "pl0 mr3" }}"
          >
            {{ range .Site.Menus.main }}
              <li
                class="list f5 f4-ns fw4 dib {{ compare.Conditional (compare.Eq $.Site.Language.LanguageDirection "rtl") "pl3" "pr3" }}"
              >
                <a
                  class="hover-white white-90 no-underline"
                  href="{{ .URL }}"
                  title="{{ lang.Translate "pageTitle" . }}"
                >
                  {{ .Name }}
                </a>
              </li>
            {{ end }}
          </ul>
        {{ end }}
      </div>

      {{ partials.IncludeCached "social/follow.html" . }}
    </div>
  </div>
</nav>

<!-- === EKRAN WYSZUKIWANIA (OVERLAY) === -->
<div id="search-overlay">
  <div class="search-overlay-content">
    <button id="close-search" aria-label="Zamknij wyszukiwarkę">&times;</button>
    <h2>Enter search term</h2>
    <input
      type="text"
      id="overlay-search-input"
      placeholder="Wprowadź wyszukiwane hasło..."
    />
    <div id="overlay-search-results"></div>
  </div>
</div>

<style>
  .header-icons i {
    display: inline-block;
    width: 1.25em; /* ensures consistent width */
    text-align: center;
  }
</style>

<script src="{{ "/js/menu.js" | relURL }}"></script>
